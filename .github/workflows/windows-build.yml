name: Build ELDEN 1 for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows x64 executable
    runs-on: windows-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and Windows export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Verify Godot console installation
        shell: pwsh
        run: |
          $godot = Join-Path $env:USERPROFILE "godot/Godot_v4.3-stable_win64.exe"
          if (!(Test-Path $godot)) {
            Get-ChildItem (Join-Path $env:USERPROFILE "godot") | Format-Table Name,Length
            throw "Godot console executable is missing."
          }
          $p = Start-Process -FilePath $godot -ArgumentList "--headless --version" -Wait -PassThru -RedirectStandardOutput "$env:TEMP\godot-version.out" -RedirectStandardError "$env:TEMP\godot-version.err"
          Get-Content "$env:TEMP\godot-version.out" -ErrorAction SilentlyContinue
          Get-Content "$env:TEMP\godot-version.err" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Godot version check failed: $($p.ExitCode)" }

      - name: Import project and check scripts
        shell: pwsh
        run: |
          $godot = Join-Path $env:USERPROFILE "godot/Godot_v4.3-stable_win64.exe"
          $p = Start-Process -FilePath $godot -ArgumentList '--headless --editor --path . --quit' -Wait -PassThru -RedirectStandardOutput "$env:TEMP\godot-import.out" -RedirectStandardError "$env:TEMP\godot-import.err"
          Get-Content "$env:TEMP\godot-import.out" -ErrorAction SilentlyContinue
          Get-Content "$env:TEMP\godot-import.err" -ErrorAction SilentlyContinue
          $logText = (Get-Content "$env:TEMP\godot-import.out" -Raw -ErrorAction SilentlyContinue) + (Get-Content "$env:TEMP\godot-import.err" -Raw -ErrorAction SilentlyContinue)
          if ($logText -match 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call\.') { throw "Godot reported a script error. Inspect $env:TEMP\godot-import.out and $env:TEMP\godot-import.err." }
          if ($p.ExitCode -ne 0) { throw "Godot project import failed: $($p.ExitCode)" }

      - name: Validate all 12 circuit data files
        shell: pwsh
        run: |
          $godot = Join-Path $env:USERPROFILE "godot/Godot_v4.3-stable_win64.exe"
          $p = Start-Process -FilePath $godot -ArgumentList '--headless --path . --script res://scripts/validate_tracks.gd' -Wait -PassThru -RedirectStandardOutput "$env:TEMP\godot-tracks.out" -RedirectStandardError "$env:TEMP\godot-tracks.err"
          Get-Content "$env:TEMP\godot-tracks.out" -ErrorAction SilentlyContinue
          Get-Content "$env:TEMP\godot-tracks.err" -ErrorAction SilentlyContinue
          $logText = (Get-Content "$env:TEMP\godot-tracks.out" -Raw -ErrorAction SilentlyContinue) + (Get-Content "$env:TEMP\godot-tracks.err" -Raw -ErrorAction SilentlyContinue)
          if ($logText -match 'TRACK VALIDATION FAILED|SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call\.') { throw "One or more circuits failed runtime validation." }
          if ($p.ExitCode -ne 0) { throw "Circuit validation failed: $($p.ExitCode)" }
          if ($logText -notmatch 'ALL 12 TRACKS LOADED SUCCESSFULLY') { throw "Circuit validation did not confirm all 12 tracks." }

      - name: Smoke-test main menu
        shell: pwsh
        run: |
          $godot = Join-Path $env:USERPROFILE "godot/Godot_v4.3-stable_win64.exe"
          $p = Start-Process -FilePath $godot -ArgumentList '--headless --path . --quit-after 3' -Wait -PassThru -RedirectStandardOutput "$env:TEMP\godot-menu.out" -RedirectStandardError "$env:TEMP\godot-menu.err"
          Get-Content "$env:TEMP\godot-menu.out" -ErrorAction SilentlyContinue
          Get-Content "$env:TEMP\godot-menu.err" -ErrorAction SilentlyContinue
          $logText = (Get-Content "$env:TEMP\godot-menu.out" -Raw -ErrorAction SilentlyContinue) + (Get-Content "$env:TEMP\godot-menu.err" -Raw -ErrorAction SilentlyContinue)
          if ($logText -match 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call\.') { throw "Godot reported a script error. Inspect $env:TEMP\godot-menu.out and $env:TEMP\godot-menu.err." }
          if ($p.ExitCode -ne 0) { throw "Main menu smoke-test failed: $($p.ExitCode)" }

      - name: Smoke-test selected 3D race scene
        shell: pwsh
        run: |
          $godot = Join-Path $env:USERPROFILE "godot/Godot_v4.3-stable_win64.exe"
          $p = Start-Process -FilePath $godot -ArgumentList '--headless --path . --quit-after 3 res://scenes/race.tscn' -Wait -PassThru -RedirectStandardOutput "$env:TEMP\godot-race.out" -RedirectStandardError "$env:TEMP\godot-race.err"
          Get-Content "$env:TEMP\godot-race.out" -ErrorAction SilentlyContinue
          Get-Content "$env:TEMP\godot-race.err" -ErrorAction SilentlyContinue
          $logText = (Get-Content "$env:TEMP\godot-race.out" -Raw -ErrorAction SilentlyContinue) + (Get-Content "$env:TEMP\godot-race.err" -Raw -ErrorAction SilentlyContinue)
          if ($logText -match 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call\.') { throw "Godot reported a script error. Inspect $env:TEMP\godot-race.out and $env:TEMP\godot-race.err." }
          if ($p.ExitCode -ne 0) { throw "Race scene smoke-test failed: $($p.ExitCode)" }

      - name: Export Windows executable
        shell: pwsh
        run: |
          $godot = Join-Path $env:USERPROFILE "godot/Godot_v4.3-stable_win64.exe"
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $p = Start-Process -FilePath $godot -ArgumentList '--headless --verbose --path . --export-release "Windows Desktop" "build/ELDEN1.exe"' -Wait -PassThru -RedirectStandardOutput "$env:TEMP\godot-export.out" -RedirectStandardError "$env:TEMP\godot-export.err"
          Get-Content "$env:TEMP\godot-export.out" -ErrorAction SilentlyContinue
          Get-Content "$env:TEMP\godot-export.err" -ErrorAction SilentlyContinue
          $logText = (Get-Content "$env:TEMP\godot-export.out" -Raw -ErrorAction SilentlyContinue) + (Get-Content "$env:TEMP\godot-export.err" -Raw -ErrorAction SilentlyContinue)
          if ($logText -match 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call\.') { throw "Godot reported a script error. Inspect $env:TEMP\godot-export.out and $env:TEMP\godot-export.err." }
          if ($p.ExitCode -ne 0) { throw "Godot export command failed: $($p.ExitCode)" }
          Get-ChildItem -Recurse build | Format-Table FullName,Length

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "build/ELDEN1.exe")) {
            throw "Windows executable was not created."
          }
          Get-Item "build/ELDEN1.exe" | Format-List Name,Length

      - name: Upload standalone Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ELDEN-1-Windows-x64
          path: build/ELDEN1.exe
          if-no-files-found: error
          retention-days: 14
