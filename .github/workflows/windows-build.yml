name: Build ELDEN 1 for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows x64 executable
    runs-on: windows-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and Windows export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Verify Godot console installation
        shell: pwsh
        run: |
          $godot = Join-Path $env:USERPROFILE "godot/Godot_v4.3-stable_win64_console.exe"
          if (!(Test-Path $godot)) {
            Get-ChildItem (Join-Path $env:USERPROFILE "godot") | Format-Table Name,Length
            throw "Godot console executable is missing."
          }
          & $godot --version
          if ($LASTEXITCODE -ne 0) { throw "Godot version check failed." }

      - name: Import project and check scripts
        shell: pwsh
        run: |
          $godot = Join-Path $env:USERPROFILE "godot/Godot_v4.3-stable_win64_console.exe"
          & $godot --headless --editor --path . --quit
          if ($LASTEXITCODE -ne 0) { throw "Godot project import failed." }

      - name: Smoke-test main menu
        shell: pwsh
        run: |
          $godot = Join-Path $env:USERPROFILE "godot/Godot_v4.3-stable_win64_console.exe"
          & $godot --headless --path . --quit-after 3
          if ($LASTEXITCODE -ne 0) { throw "Main menu smoke-test failed." }

      - name: Smoke-test selected 3D race scene
        shell: pwsh
        run: |
          $godot = Join-Path $env:USERPROFILE "godot/Godot_v4.3-stable_win64_console.exe"
          & $godot --headless --path . --quit-after 3 res://scenes/race.tscn
          if ($LASTEXITCODE -ne 0) { throw "Race scene smoke-test failed." }

      - name: Export Windows executable
        shell: pwsh
        run: |
          $godot = Join-Path $env:USERPROFILE "godot/Godot_v4.3-stable_win64_console.exe"
          New-Item -ItemType Directory -Force -Path build | Out-Null
          & $godot --headless --verbose --path . --export-release "Windows Desktop" "build/ELDEN 1.exe"
          if ($LASTEXITCODE -ne 0) { throw "Godot export command failed." }
          Get-ChildItem -Recurse build | Format-Table FullName,Length

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "build/ELDEN 1.exe")) {
            throw "Windows executable was not created."
          }
          Get-Item "build/ELDEN 1.exe" | Format-List Name,Length

      - name: Upload standalone Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ELDEN-1-Windows-x64
          path: build/ELDEN 1.exe
          if-no-files-found: error
          retention-days: 14
